name: 持续集成

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    name: 验证项目
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码检查
        run: pnpm lint

      - name: 运行测试
        run: pnpm test

      - name: 构建项目
        run: pnpm build
